<footer class="h-card mt-auto shrink-0 border-t border-slate-200/80 py-6">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="w-full flex justify-center gap-6">


    <!-- <h2 class="footer-heading">{{ site.title | escape }}</h2> -->
    <div class="w-full px-6 flex flex-col gap-6 sm:w-1/2 lg:w-1/3 sm:px-0 sm:flex-row sm:items-start sm:justify-between">

      <div class="w-full grid grid-cols-1 gap-6 md:grid-cols-3">
        
        <div class="col">
          <ul class="contact-list">
            <li class="p-name">
              {%- if site.author -%}
                {{ site.author | escape }}
              {%- else -%}
                {{ site.title | escape }}
              {%- endif -%}
              </li>
              {%- if site.email -%}
              <li><a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a></li>
              {%- endif -%}
          </ul>
        </div>

        <div class="col-span-2">
          {%- include social.html -%}
        </div>

        <!--<div class="footer-col footer-col-3">
          <p>{{- site.description | escape -}}</p>
        </div>-->
      </div>
    </div>
  </div>

</footer>
