<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

  {%- include head.html -%}

  <body class="portfolio-page">

    <main class="w-full min-w-0 overflow-x-hidden break-words pt-12" aria-label="Content">
      <div class="px-6">
        <article class="w-full mx-auto sm:w-1/2 lg:w-1/3">
          <div class="post-content leading-7 text-slate-700 [&_h3]:mt-8 [&_h3]:text-xl [&_a]:underline [&_a]:underline-offset-2">
            {{ content }}
          </div>
        </article>
      </div>
    </main>

    <script type="module" src="{{ '/assets/js/portfolio-motion.js' | relative_url }}"></script>

  </body>

</html>
