---
layout: default_no_wrapper
---

<article class="w-full mx-auto sm:w-1/2 lg:w-1/3">
  <header class="post-header">
    <h1 class="post-title text-2xl font-semibold tracking-tight text-slate-950 md:text-5xl">{{ page.title }}</h1>
    <p class="post-meta text-sm text-slate-500">
      Published on {{ page.date | date: "%B %d, %Y" }}
      {% if page.doi %}
        | DOI: <a href="https://doi.org/{{ page.doi }}" target="_blank">{{ page.doi }}</a>
      {% endif %}

      {% if page.localfile %}
        | <a href="{{base_path}}/assets/papers/{{page.localfile}}"> Download</a>
      {% endif %}
    </p>
  </header>

  <div class="post-content leading-7 text-slate-700 [&_h2]:mt-10 [&_h2]:text-2xl [&_h2]:font-semibold [&_a]:text-blue-700 [&_a]:underline [&_a]:underline-offset-2">
    {{ content }}
  </div>
</article>
